settings:
  ai_bots_love_markdown.enableContentNegotiation:
    type: bool
    default: true
    label: 'Enable content negotiation via Accept header'
  ai_bots_love_markdown.enableDiscoveryTag:
    type: bool
    default: true
    label: 'Add <link rel="alternate"> tag for Markdown discovery'
  ai_bots_love_markdown.pageTypeSuffix:
    type: string
    default: 'ai-bots-love.md'
    label: 'PageType Suffix for Markdown link'
  ai_bots_love_markdown.pageTypeTypeNum:
    type: int
    default: 2026
    label: 'PageType TypeNum for Markdown link'
  ai_bots_love_markdown.removeElements:
    type: string
    default: 'script style nav footer aside form iframe noscript'
    label: 'Space-separated HTML tags to strip from markdown output'
  ai_bots_love_markdown.excludedDoktypes:
    type: string
    default: '3,4,6,7,199,254,255'
    label: 'Comma-separated page doktypes that never produce a Markdown alternate response (default: standard TYPO3 system doktypes)'
  ai_bots_love_markdown.cacheable:
    type: bool
    default: true
    label: 'Allow CDN/reverse-proxy caching of Markdown responses (disable to track every hit at the origin)'
