settings:
  ai_bots_love_markdown.enableContentNegotiation:
    type: bool
    default: true
    label: 'Enable content negotiation via Accept header'
  ai_bots_love_markdown.enableDiscoveryTag:
    type: bool
    default: true
    label: 'Add <link rel="alternate"> tag for Markdown discovery'
  ai_bots_love_markdown.cacheable:
    type: bool
    default: true
    label: 'Allow CDN/reverse-proxy caching of Markdown responses (disable to track every hit at the origin)'
